[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choroid-cvi-extraction"
version = "0.1.0"
description = "Reproducible OCT-derived choroidal vascularity phenotype extraction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=9.5,<13",
    "lxml>=4.9,<7",
    "svglib==1.4.1",
    "reportlab>=3.6,<5",
    "rlPyCairo>=0.4,<1",
]

[project.scripts]
choroid-cvi = "choroid_cvi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

