name: choroid-cvi
channels:
  - conda-forge
dependencies:
  # Keep the image-processing and SVG-rendering libraries in one Conda environment.
  - python=3.11
  - pip
  - setuptools>=68
  - wheel
  - numpy=1.26
  - scipy=1.13
  - opencv=4.10
  - pillow=10
  - lxml=5
  - svglib=1.4.1
  - reportlab=4
  - rlpycairo=0.4.0
  - pycairo
  - cairo
  - freetype-py
