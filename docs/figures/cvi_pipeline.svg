<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="400" viewBox="0 0 1460 400" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">CVI extraction from one OCT volume</title>
  <desc id="diagramDesc">A five-stage schematic: select five central OCT B-scans, provide choroid SVG masks, align and preprocess a volume, segment vessels and calculate column-wise CVI as vessel pixels divided by choroidal pixels, then summarize by the median of per-B-scan means and spatial standard deviations. All drawings are synthetic.</desc>
  <rect width="1460" height="400" fill="#ffffff"/>
  <text x="30" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#183344">One OCT volume → two choroidal vascularity phenotypes</text>
  <text x="30" y="67" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#516674">Schematic of the five-central-B-scan method · Illustration only, no patient images</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g fill="#f7fafc" stroke="#ccdae0" stroke-width="1.5">
      <rect x="30" y="94" width="260" height="275" rx="12"/>
      <rect x="315" y="94" width="260" height="275" rx="12"/>
      <rect x="600" y="94" width="260" height="275" rx="12"/>
      <rect x="885" y="94" width="260" height="275" rx="12"/>
      <rect x="1170" y="94" width="260" height="275" rx="12"/>
    </g>
    <g fill="#163847" font-size="17" font-weight="700">
      <text x="48" y="127">1. Central B-scans</text>
      <text x="333" y="127">2. Choroid masks</text>
      <text x="618" y="127">3. Align + preprocess</text>
      <text x="903" y="127">4. Vessels + CVI(x)</text>
      <text x="1188" y="127">5. Eye-level values</text>
    </g>
    <g fill="#627683" font-size="14">
      <text x="48" y="344">Choose 5 central slices</text>
      <text x="333" y="344">Matching SVG for each</text>
      <text x="618" y="344">Use all 5 as a stack</text>
      <text x="903" y="344">Pixels within choroid</text>
      <text x="1188" y="344">Median across 5 B-scans</text>
    </g>
    <!-- 1: simplified stacked B-scans -->
    <g stroke="#4c6472" stroke-width="1.5">
      <rect x="75" y="175" width="155" height="80" fill="#e2e7ec" rx="3"/>
      <rect x="65" y="185" width="155" height="80" fill="#e9edf1" rx="3"/>
      <rect x="55" y="195" width="155" height="80" fill="#f2f5f7" rx="3"/>
    </g>
    <path d="M55 222 Q85 215 110 222 T165 221 T210 222" fill="none" stroke="#99afbd" stroke-width="3"/>
    <path d="M55 247 Q85 242 110 251 T165 249 T210 246" fill="none" stroke="#d1ae7e" stroke-width="6"/>
    <g fill="#2f798a">
      <circle cx="89" cy="259" r="7"/><circle cx="138" cy="254" r="5"/><circle cx="179" cy="261" r="8"/>
    </g>
    <text x="48" y="306" fill="#344e5b" font-size="14">UKB: 128 scans/volume</text>
    <text x="48" y="324" fill="#344e5b" font-size="14">OL: 256 scans/volume</text>
    <!-- 2: mask -->
    <rect x="344" y="190" width="200" height="96" rx="3" fill="#ebeff2" stroke="#aebfc9"/>
    <path d="M344 233 Q382 225 409 233 T467 233 T544 230 L544 281 L344 281 Z" fill="#d6eee4" stroke="#2f8e77" stroke-width="2"/>
    <g fill="#2d8091">
      <ellipse cx="378" cy="261" rx="12" ry="7"/><ellipse cx="426" cy="257" rx="17" ry="9"/><ellipse cx="496" cy="262" rx="13" ry="10"/>
    </g>
    <text x="333" y="306" fill="#344e5b" font-size="14">Upstream segmented layer</text>
    <text x="333" y="324" fill="#344e5b" font-size="14">CC + choroidal stroma</text>
    <!-- 3: flattened stack -->
    <rect x="628" y="190" width="204" height="96" rx="3" fill="#e9eff1" stroke="#afc6cf"/>
    <rect x="629" y="230" width="202" height="53" fill="#dcf0e6"/>
    <line x1="629" y1="230" x2="831" y2="230" stroke="#167a80" stroke-width="3"/>
    <path d="M629 217 C670 212 700 219 735 217 S803 212 831 218" fill="none" stroke="#b6c9d4" stroke-width="4"/>
    <g fill="#2f8290">
      <ellipse cx="660" cy="250" rx="10" ry="8"/><ellipse cx="704" cy="267" rx="15" ry="9"/><ellipse cx="755" cy="249" rx="9" ry="7"/><ellipse cx="792" cy="261" rx="13" ry="8"/>
    </g>
    <text x="618" y="306" fill="#344e5b" font-size="14">Bruch's membrane flat</text>
    <text x="618" y="324" fill="#344e5b" font-size="14">3-D intensity normalization</text>
    <!-- 4: segmented vessels and per-column ratio -->
    <rect x="910" y="175" width="211" height="112" rx="3" fill="#d9eee4" stroke="#5f9f8e"/>
    <g stroke="#a2c9bd" stroke-width="1">
      <line x1="936" y1="175" x2="936" y2="287"/><line x1="962" y1="175" x2="962" y2="287"/>
      <line x1="988" y1="175" x2="988" y2="287"/><line x1="1014" y1="175" x2="1014" y2="287"/>
      <line x1="1040" y1="175" x2="1040" y2="287"/><line x1="1066" y1="175" x2="1066" y2="287"/>
      <line x1="1092" y1="175" x2="1092" y2="287"/>
    </g>
    <g fill="#2b7181">
      <ellipse cx="933" cy="234" rx="15" ry="10"/><ellipse cx="981" cy="207" rx="18" ry="11"/>
      <ellipse cx="1032" cy="247" rx="24" ry="17"/><ellipse cx="1084" cy="222" rx="16" ry="12"/>
    </g>
    <path d="M1014 168 V293" stroke="#bd4f68" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="903" y="308" fill="#253e4a" font-weight="700" font-size="14">CVI(x) = vessel pixels</text>
    <line x1="972" y1="311" x2="1094" y2="311" stroke="#253e4a" stroke-width="1"/>
    <text x="989" y="328" fill="#253e4a" font-size="13">choroid pixels</text>
    <!-- 5: within-B-scan curve and aggregation -->
    <line x1="1197" y1="281" x2="1402" y2="281" stroke="#9eb3bf" stroke-width="2"/>
    <line x1="1197" y1="176" x2="1197" y2="281" stroke="#9eb3bf" stroke-width="2"/>
    <path d="M1199 244 L1220 230 L1241 252 L1262 221 L1283 236 L1304 209 L1325 220 L1346 204 L1367 218 L1388 198" fill="none" stroke="#007e88" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="1197" y1="229" x2="1402" y2="229" stroke="#bf7b32" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1200" y="163" fill="#38586a" font-size="14">CVI across columns (x)</text>
    <text x="1188" y="306" fill="#344e5b" font-size="14">Per-scan mean and SD</text>
    <text x="1188" y="324" fill="#344e5b" font-size="14">→ CVI mean, spatial SD</text>
    <!-- arrows -->
    <g stroke="#688696" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 231 H310"/><path d="M304 226 L310 231 L304 236"/>
      <path d="M581 231 H595"/><path d="M589 226 L595 231 L589 236"/>
      <path d="M866 231 H880"/><path d="M874 226 L880 231 L874 236"/>
      <path d="M1151 231 H1165"/><path d="M1159 226 L1165 231 L1159 236"/>
    </g>
  </g>
</svg>
